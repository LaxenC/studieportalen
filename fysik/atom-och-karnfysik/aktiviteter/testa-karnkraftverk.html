<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#eef3fb; --panel:#ffffff; --ink:#152238; --muted:#4f5d75; --line:#d5deeb;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#dbe7ff;
  --green-bg:#e8f7ec; --green-bd:#a9dfb8; --green:#2f9e57;
  --blue-bg:#e6f1fc; --blue-bd:#a8cdf1; --blue:#2b78c9;
  --yellow-bg:#fff6dd; --yellow-bd:#f2d78a; --yellow:#b7850c;
  --red-bg:#fdeaec; --red-bd:#f2b3b9; --red:#d63c45;
  --purple-bg:#f0ebfd; --purple-bd:#c9b8f5; --purple:#6d48d6;
  --c14:#e07a1f; --n14:#2b78c9;
  --font:"Nunito",system-ui,sans-serif; --serif:"Noto Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626; --panel:#18223a; --ink:#e8edf7; --muted:#a6b1c6; --line:#2c3a58;
  --accent:#5b8cff; --accent-ink:#0f1626; --accent-soft:#233a6b;
  --green-bg:#16301f; --green-bd:#2f6b44; --green:#5fd38a;
  --blue-bg:#152a44; --blue-bd:#2f5d8f; --blue:#6fb0f2;
  --yellow-bg:#33290f; --yellow-bd:#6f5a1c; --yellow:#f0c44a;
  --red-bg:#3a1a20; --red-bd:#7a3540; --red:#ff7a82;
  --purple-bg:#251d45; --purple-bd:#4f3e94; --purple:#a88cff;
  --c14:#ff9f4a; --n14:#6fb0f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626; --panel:#18223a; --ink:#e8edf7; --muted:#a6b1c6; --line:#2c3a58;
  --accent:#5b8cff; --accent-ink:#0f1626; --accent-soft:#233a6b;
  --green-bg:#16301f; --green-bd:#2f6b44; --green:#5fd38a;
  --blue-bg:#152a44; --blue-bd:#2f5d8f; --blue:#6fb0f2;
  --yellow-bg:#33290f; --yellow-bd:#6f5a1c; --yellow:#f0c44a;
  --red-bg:#3a1a20; --red-bd:#7a3540; --red:#ff7a82;
  --purple-bg:#251d45; --purple-bd:#4f3e94; --purple:#a88cff;
  --c14:#ff9f4a; --n14:#6fb0f2; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:18px}
header h1{margin:0;font-weight:900;font-size:clamp(1.8rem,4.5vw,2.5rem);line-height:1.1}
header p{margin:6px 0 0;color:var(--muted);font-size:1.08rem;max-width:68ch}
.eyebrow{margin:0 0 4px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted)}
.panel{background:var(--panel);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
h2{margin:0;font-weight:900;font-size:1.35rem}
h3{margin:0;font-weight:900;font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}


.btn{font:inherit;font-weight:900;padding:7px 14px;font-size:.92rem;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.wrap{padding:14px 12px 24px;gap:12px}
header h1{font-size:clamp(1.4rem,3vw,1.9rem)}
header p{font-size:.98rem}
.panel{padding:14px;gap:10px}
.arbete{display:grid;gap:12px;grid-template-areas:"rit" "sida";min-width:0}
.ritning{grid-area:rit;border-radius:14px;background:#f7fafe;overflow:hidden;border:1px solid var(--line)}
.ritning svg{display:block;width:100%;height:auto;max-height:max(320px,calc(var(--skarm,100vh) - 170px))}
.sida{grid-area:sida;display:grid;gap:10px;align-content:start;min-width:0}
@media (min-width:760px){.wrap{max-width:1500px}.arbete{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"rit sida";align-items:start}}
@media (min-width:1150px){.arbete{grid-template-columns:minmax(0,1fr) 340px}}
.ruta{border-radius:12px;padding:10px 12px;background:var(--bg);display:grid;gap:8px}
.ruta h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.reglage{display:grid;gap:4px}
.reglage label{font-weight:900;font-size:.9rem;display:flex;justify-content:space-between}
.reglage output{font-variant-numeric:tabular-nums}
.reglage input{width:100%;accent-color:#3a3f47}
.vaxlar{display:grid;gap:6px}
.vaxel{font:inherit;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:10px;border:1.5px solid var(--green-bd);background:var(--green-bg);color:var(--ink);cursor:pointer;font-size:.88rem;font-weight:800}
.vaxel span{font-size:.78rem;font-weight:900;color:var(--green);white-space:nowrap}
.vaxel[aria-pressed="false"]{border-color:var(--red-bd);background:var(--red-bg)}
.vaxel[aria-pressed="false"] span{color:var(--red)}
.vaxel:hover{outline:2px solid var(--accent)}
.kedjan{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.8rem;font-weight:800}
.kedjan span{padding:3px 8px;border-radius:999px;background:var(--green-bg);border:1px solid var(--green-bd)}
.kedjan span.av{background:var(--panel);border:1px dashed var(--line);color:var(--muted);text-decoration:line-through}
.kedjan i{font-style:normal;color:var(--muted)}
.forklaring{display:grid;gap:6px;font-size:.88rem;line-height:1.45}
.forklaring p{margin:0;padding:7px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.forklaring p.varn{background:var(--red-bg);border-color:var(--red-bd);font-weight:800}
.forklaring p.ok{background:var(--green-bg);border-color:var(--green-bd)}
.dold{display:none}
#verk [data-del]{cursor:pointer;outline:none}
#verk [data-del]:hover,#verk [data-del]:focus-visible{filter:drop-shadow(0 0 5px #2563eb) drop-shadow(0 0 2px #2563eb)}
.flode{fill:none;stroke-linecap:round;stroke-dasharray:4 22;animation:flyt 1.4s linear infinite}
.flode.lang{animation-duration:2.2s}
@keyframes flyt{to{stroke-dashoffset:-26}}
.rotor{animation:snurr .5s linear infinite}
@keyframes snurr{to{transform:translateY(-20px)}}
.bubbla{animation:stig 3s linear infinite;transform-box:fill-box}
@keyframes stig{0%{transform:translateY(0);opacity:0}10%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-320px);opacity:0}}
.glod{animation:glod 1.6s ease-in-out infinite alternate}
@keyframes glod{from{opacity:.35}to{opacity:.9}}
.blixt{animation:blixt .9s ease-in-out infinite alternate}
@keyframes blixt{from{opacity:.3}to{opacity:1}}
.genhjul{animation:hjul 1s linear infinite;transform-origin:130px 125px}
@keyframes hjul{to{transform:rotate(360deg)}}
.stopp,.stopp *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.ritning *{animation-play-state:paused!important}}
</style>
</head>

      <div class="sida">
        <div class="ruta">
          <div class="reglage"><label for="stavReg">Styrstavar <output id="stavUt" for="stavReg">60 % inne</output></label>
            <input type="range" id="stavReg" min="0" max="100" step="10" value="60"></div>
          <div class="vaxlar" id="vaxlar"></div>
          <button type="button" class="btn" id="aterstall">↺ Återställ allt</button>
        </div>
        <div class="ruta"><h3>Energin omvandlas</h3><div class="kedjan" id="kedjan"></div></div>
        <div class="ruta"><h3>Vad händer?</h3><div class="forklaring" id="forklaring" aria-live="polite"></div></div>
      </div>
    </div>
  </section>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const reg = $("stavReg"), regUt = $("stavUt");
const DELAR = [
  ["bransle", "Kärnbränsle", "i reaktorn", "borttaget"],
  ["vatten", "Vatten i reaktorn", "fyllt", "tömt"],
  ["kyl", "Kylning i värmeväxlaren", "på", "av"],
  ["turbin", "Turbin", "på", "avstängd"],
  ["generator", "Generator", "inkopplad", "borttagen"]
];
const SVGDEL = { bransle: "bransle", vatten: "vatten", varmevaxlare: "kyl", turbin: "turbin", generator: "generator" };

function bas() {
  return { on: { bransle: true, vatten: true, kyl: true, turbin: true, generator: true },
    p: .6, stavar: .6, cur: { effekt: 1, temp: .55, niva: 1 }, smalt: false, fyll: false };
}
let S = bas();

function ritaVaxlar() {
  $("vaxlar").innerHTML = DELAR.map(([k, namn, pa, av]) =>
    `<button type="button" class="vaxel" data-vaxel="${k}" aria-pressed="${S.on[k]}">${namn}<span>${S.on[k] ? "✔ " + pa : "✖ " + av}</span></button>`).join("");
}
function vaxla(k) {
  S.on[k] = !S.on[k];
  if (k === "vatten" && S.on.vatten) S.fyll = true;
  ritaVaxlar();
}
$("vaxlar").addEventListener("click", e => { const b = e.target.closest("[data-vaxel]"); if (b) vaxla(b.dataset.vaxel); });
const svg = $("verk");
function klickDel(d) {
  if (d === "styrstavar") { S.p = S.p < 1 ? 1 : .6; reg.value = Math.round(S.p * 100); visaReg(); return; }
  if (SVGDEL[d]) vaxla(SVGDEL[d]);
}
svg.addEventListener("click", e => { const g = e.target.closest("[data-del]"); if (g) klickDel(g.dataset.del); });
svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.del) { e.preventDefault(); klickDel(e.target.dataset.del); } });
function visaReg() { regUt.textContent = `${reg.value} % inne`; }
reg.addEventListener("input", () => { S.p = Number(reg.value) / 100; visaReg(); });
$("aterstall").addEventListener("click", () => { S = bas(); reg.value = 60; visaReg(); ritaVaxlar(); });

/* ---------- simulering ---------- */
const narma = (a, b, f) => Math.abs(b - a) <= f ? b : a + Math.sign(b - a) * f;
const kl = (id, c, on) => $(id).classList.toggle(c, !!on);
let t0 = performance.now(), senasteText = "";
function steg(t) {
  const dt = Math.min(.1, (t - t0) / 1000); t0 = t;
  const o = S.on, c = S.cur;
  S.stavar = narma(S.stavar, S.p, 1.5 * dt);
  // fission
  const fission = S.p >= .95 ? 0 : Math.max(0, Math.min(2.5, (1 - S.p) / .4));
  const moderator = o.vatten ? Math.min(1, c.niva / .6) : 0;
  const effektMal = o.bransle && !S.smalt ? fission * moderator : 0;
  c.effekt = narma(c.effekt, effektMal, .6 * dt);
  const varme = c.effekt + (o.bransle ? .12 : 0);
  const vattenOk = o.vatten && c.niva > .3;
  const anga = vattenOk && varme > .1;   // även restvärmen kokar vattnet
  const angaFlode = anga && o.turbin;
  const kondens = angaFlode && o.kyl;
  // vattennivå
  let nivaMal = c.niva, nivaFart = .05;
  if (!o.vatten) { nivaMal = 0; nivaFart = .5; }
  else if (S.fyll) { nivaMal = 1; nivaFart = .3; if (c.niva >= 1) S.fyll = false; }
  else if (angaFlode && !o.kyl) { nivaMal = 0; nivaFart = .06; }
  else if (kondens) nivaMal = 1;
  c.niva = narma(c.niva, nivaMal, nivaFart * dt);
  // temperatur
  let tempMal;
  if (varme < .05) tempMal = .15;
  else if (vattenOk && !anga) tempMal = .3;
  else if (anga && o.turbin && o.kyl) tempMal = .35 + .2 * Math.min(c.effekt, 2.5);
  else tempMal = 1;
  c.temp = narma(c.temp, tempMal, (tempMal > c.temp ? .07 : .1) * dt);
  if (o.bransle && c.temp > .95 && c.niva < .4) S.smalt = true;
  const snurrar = angaFlode && varme > .2;
  const el = snurrar && o.generator;

  // ---------- rita ----------
  document.querySelectorAll("#verk .snurr").forEach(e => e.classList.toggle("stopp", !snurrar));
  ["angaTurbin", "angaRor", "angaNer"].forEach(id => kl(id, "dold", !angaFlode));
  kl("elUt", "dold", !el); kl("blixt", "dold", !el);
  kl("generatorDel", "dold", !o.generator); kl("genBorta", "dold", o.generator);
  kl("turbinAv", "dold", o.turbin);
  kl("kylFlode", "dold", !o.kyl); kl("kylAv", "dold", o.kyl);
  kl("returFlode", "dold", !kondens);
  kl("bransleGrupp", "dold", !o.bransle || S.smalt); kl("bransleBorta", "dold", o.bransle); kl("smalt", "dold", !S.smalt);
  $("glodGrupp").style.opacity = Math.max(0, Math.min(1, c.effekt));
  $("bubblor").style.opacity = o.vatten ? Math.max(0, Math.min(1, (c.temp - .25) * 2.2)) : 0;
  const v = Math.max(0, Math.min(1, (c.temp - .5) / .45));
  const blanda = (a, b) => "#" + [0, 2, 4].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - v) + parseInt(b.substr(i, 2), 16) * v).toString(16).padStart(2, "0")).join("");
  $("vTopp").setAttribute("stop-color", blanda("bfe3f7", "fed7aa")); $("vBotten").setAttribute("stop-color", blanda("6fb8e6", "ef4444"));
  const y = 150 + (1 - c.niva) * 402;
  $("vatten").setAttribute("y", y); $("vatten").setAttribute("height", Math.max(0, 552 - y)); $("vattenClip").setAttribute("y", y);
  const ut = Math.max(0, Math.min(230, y - 250));
  document.querySelectorAll("#hettGrupp .hett").forEach(r => { r.setAttribute("height", ut); r.style.opacity = ut && c.temp > .6 ? .85 : 0; });
  $("stavar").setAttribute("transform", `translate(0 ${((1 - S.stavar) * 230).toFixed(1)})`);
  const eh = Math.min(160, c.effekt / 2 * 160);
  $("effektStapel").setAttribute("y", 244 - eh); $("effektStapel").setAttribute("height", eh); $("effektStapel").setAttribute("fill", c.effekt > 1.6 ? "#ef4444" : "#a78bfa");
  const th = c.temp * 160; $("tempStapel").setAttribute("y", 244 - th); $("tempStapel").setAttribute("height", th); $("tempStapel").setAttribute("fill", c.temp > .8 ? "#ef4444" : "#f59e0b");
  const nh = c.niva * 160; $("nivaStapel").setAttribute("y", 244 - nh); $("nivaStapel").setAttribute("height", nh);
  $("elLampa").setAttribute("fill", el ? "#facc15" : "#4b5563"); $("elText").textContent = el ? "PÅ" : "AV"; $("elText").setAttribute("fill", el ? "#fde68a" : "#9ca3af");
  const farlig = S.smalt || c.temp > .8;
  kl("varning", "dold", !farlig);
  $("varning").textContent = S.smalt ? "⚠ HÄRDSMÄLTA" : "⚠ För varmt!";

  // ---------- energikedjan ----------
  const kedja = [["kärnenergi", c.effekt > .1], ["värme", o.bransle && varme > .15 && !S.smalt], ["rörelseenergi", snurrar], ["elenergi", el]];
  const kh = kedja.map(([n, ok]) => `<span class="${ok ? "" : "av"}">${n}</span>`).join("<i>→</i>");
  if ($("kedjan").innerHTML !== kh) $("kedjan").innerHTML = kh;

  // ---------- förklaring ----------
  const r = [];
  if (!o.bransle) r.push(["", "Kärnbränslet är borttaget. <b>Därför</b> sker ingen fission – det blir ingen värme, ingen ånga och ingen el."]);
  else if (S.smalt) r.push(["varn", "Härdsmälta! Bränslet blev så varmt att det smälte. Tryck på <b>Återställ allt</b>."]);
  if (o.bransle && !S.smalt) {
    if (!o.vatten) r.push(["varn", "Vattnet i reaktorn är borta. Utan vatten bromsas inte neutronerna, <b>därför</b> slutar kedjereaktionen. Men bränslet är fortfarande varmt och kyls inte – <b>därför</b> blir det varmare och varmare."]);
    else if (c.niva < .45) r.push(["varn", "Vattnet räcker inte till. Bränslet hamnar ovanför vattnet och kyls inte – <b>därför</b> överhettas det."]);
    if (S.p >= .95) r.push(["", "Styrstavarna är helt inne och fångar upp neutronerna. <b>Därför</b> slutar kedjereaktionen. Bränslet är ändå fortfarande lite varmt."]);
    else if (S.p <= .2 && o.vatten) r.push(["varn", "Nästan alla styrstavar är ute. <b>Därför</b> blir det många fler fissioner – effekten och temperaturen blir för höga."]);
    else if (S.p < .6) r.push(["", "Styrstavarna är en bit ute. <b>Därför</b> blir det fler fissioner och mer värme."]);
    else if (S.p > .6) r.push(["", "Styrstavarna är en bit inne. <b>Därför</b> blir det färre fissioner och mindre värme."]);
  }
  if (!o.kyl) r.push([o.bransle && o.vatten ? "varn" : "", "Kylningen i värmeväxlaren är avstängd. <b>Därför</b> blir ångan inte till vatten igen, och inget vatten kommer tillbaka till reaktorn. Vattnet i reaktorn blir varmare och kokar bort – till slut hamnar bränslet ovanför vattnet."]);
  if (!o.turbin) r.push([o.bransle && o.vatten ? "varn" : "", "Turbinen är avstängd. <b>Därför</b> kan ångan inte gå vidare – det blir ingen el, och värmen stannar i reaktorn. Temperaturen och trycket stiger."]);
  if (!o.generator) r.push(["", "Generatorn är borttagen. Turbinen snurrar, men <b>därför</b> blir rörelseenergin inte till el."]);
  if (!r.length) r.push(["ok", "Allt fungerar. Bränslet värmer vattnet till ånga, ångan snurrar turbinen och generatorn gör el. I värmeväxlaren blir ångan vatten igen."]);
  const txt = r.map(([k, s]) => `<p class="${k}">${s}</p>`).join("");
  if (txt !== senasteText) { $("forklaring").innerHTML = txt; senasteText = txt; }
  requestAnimationFrame(steg);
}
function skarm() { let h = innerHeight; try { if (parent !== window) h = parent.innerHeight; } catch (e) {} document.documentElement.style.setProperty("--skarm", h + "px"); }
skarm(); addEventListener("resize", skarm); try { if (parent !== window) parent.addEventListener("resize", skarm); } catch (e) {}
ritaVaxlar(); visaReg(); requestAnimationFrame(steg);

</script>
