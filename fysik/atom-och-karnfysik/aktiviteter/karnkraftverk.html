<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olyckorna i kärnkraftverken</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Serif:wght@700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#eef3fb; --panel:#ffffff; --ink:#152238; --muted:#4f5d75; --line:#d5deeb;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#dbe7ff;
  --green-bg:#e8f7ec; --green-bd:#a9dfb8; --green:#2f9e57;
  --blue-bg:#e6f1fc; --blue-bd:#a8cdf1; --blue:#2b78c9;
  --yellow-bg:#fff6dd; --yellow-bd:#f2d78a; --yellow:#b7850c;
  --red-bg:#fdeaec; --red-bd:#f2b3b9; --red:#d63c45;
  --purple-bg:#f0ebfd; --purple-bd:#c9b8f5; --purple:#6d48d6;
  --c14:#e07a1f; --n14:#2b78c9;
  --font:"Nunito",system-ui,sans-serif; --serif:"Noto Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626; --panel:#18223a; --ink:#e8edf7; --muted:#a6b1c6; --line:#2c3a58;
  --accent:#5b8cff; --accent-ink:#0f1626; --accent-soft:#233a6b;
  --green-bg:#16301f; --green-bd:#2f6b44; --green:#5fd38a;
  --blue-bg:#152a44; --blue-bd:#2f5d8f; --blue:#6fb0f2;
  --yellow-bg:#33290f; --yellow-bd:#6f5a1c; --yellow:#f0c44a;
  --red-bg:#3a1a20; --red-bd:#7a3540; --red:#ff7a82;
  --purple-bg:#251d45; --purple-bd:#4f3e94; --purple:#a88cff;
  --c14:#ff9f4a; --n14:#6fb0f2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626; --panel:#18223a; --ink:#e8edf7; --muted:#a6b1c6; --line:#2c3a58;
  --accent:#5b8cff; --accent-ink:#0f1626; --accent-soft:#233a6b;
  --green-bg:#16301f; --green-bd:#2f6b44; --green:#5fd38a;
  --blue-bg:#152a44; --blue-bd:#2f5d8f; --blue:#6fb0f2;
  --yellow-bg:#33290f; --yellow-bd:#6f5a1c; --yellow:#f0c44a;
  --red-bg:#3a1a20; --red-bd:#7a3540; --red:#ff7a82;
  --purple-bg:#251d45; --purple-bd:#4f3e94; --purple:#a88cff;
  --c14:#ff9f4a; --n14:#6fb0f2; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:18px}
header h1{margin:0;font-weight:900;font-size:clamp(1.8rem,4.5vw,2.5rem);line-height:1.1}
header p{margin:6px 0 0;color:var(--muted);font-size:1.08rem;max-width:68ch}
.eyebrow{margin:0 0 4px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted)}
.panel{background:var(--panel);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
h2{margin:0;font-weight:900;font-size:1.35rem}
h3{margin:0;font-weight:900;font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}


.knapprad{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:900;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.arbete{display:grid;gap:12px;grid-template-areas:"rit" "reg" "steg" "delar" "knapp";min-width:0}
.arbete .kedjaRam{grid-area:kedja}.arbete .ritning{grid-area:rit}.arbete .reglage{grid-area:reg}.arbete .sida{grid-area:steg;display:grid;gap:12px;min-width:0}.arbete .delar{grid-area:delar}.arbete .knapprad.nere{grid-area:knapp}
@media (min-width:1250px){.wrap{max-width:1400px}
 .arbete{grid-template-columns:minmax(0,1fr) 370px;grid-template-areas:"rit steg" "reg steg" "delar steg" "knapp steg";align-items:start}
 .arbete .sida{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.kedjaRam{border-radius:14px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);display:grid;gap:8px}
.kedjaRam h3{font-size:.9rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kedja{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 4px}
.kedja li{display:grid;align-content:start;gap:1px;max-width:15em;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:.9rem;line-height:1.35}
.kedja li+li{margin-left:22px;position:relative}
.kedja li+li::before{content:"→";position:absolute;left:-19px;top:50%;transform:translateY(-50%);font-weight:900;color:var(--muted)}
.kedja li small{color:var(--muted);font-style:italic;font-weight:700;font-size:.78rem}
.kedja li.ny{border-color:var(--green);background:var(--green-bg)}.kedja li.ny span{font-weight:800}
.stavval{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.olyckor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.olycka{font:inherit;text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.olycka b{font-size:1.1rem;font-weight:900}.olycka span{color:var(--muted);font-weight:700;font-size:.92rem}
.olycka:hover{border-color:var(--accent)}
.olycka[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.olycka .klar{color:var(--green);font-weight:900}
.ritning{border-radius:14px;background:#f7fafe;overflow:hidden;border:1px solid var(--line)}
.ritning svg{display:block;width:100%;height:auto}
.reglage{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg);border-radius:12px;padding:10px 14px}
.reglage label{font-weight:900}
.reglage input{flex:1;min-width:160px;accent-color:#3a3f47}
.reglage output{font-weight:900;font-variant-numeric:tabular-nums;min-width:7.5em}
.delar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reglage.ledtrad-reg{outline:3px solid #f59e0b;animation:blinkK .55s ease-in-out infinite alternate}
.delar small{color:var(--muted);font-weight:800;margin-right:4px}
.delar button{font:inherit;font-weight:800;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.delar button:hover{border-color:var(--accent);color:var(--accent)}
.delar button.ledtrad{border-color:#f59e0b;background:#fff1d6;color:#7a4a00;animation:blinkK .55s ease-in-out infinite alternate}
@keyframes blinkK{to{box-shadow:0 0 0 5px #f59e0b66;opacity:.6}}
.steg{border-radius:14px;padding:16px 18px;background:var(--blue-bg);border:2px solid var(--blue-bd);display:grid;gap:10px}
.steg .nr{font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;color:var(--blue)}
.steg .text{font-size:1.08rem;line-height:1.55}
.steg .gor{font-weight:900;color:var(--blue)}
.svar{border-radius:12px;padding:10px 14px;font-weight:700}
.svar.fel{background:var(--red-bg);border:1px solid var(--red-bd)}
.svar.ratt{background:var(--green-bg);border:1px solid var(--green-bd)}
.svar.info{background:var(--yellow-bg);border:1px solid var(--yellow-bd)}
.alt{display:grid;gap:8px}
.svar.gissa{display:grid;gap:10px}
.svar.gissa small{color:var(--red);font-weight:800}
.alt button{font:inherit;text-align:left;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.alt button:hover{border-color:var(--accent)}
.alt button.fel{border-color:var(--red);background:var(--red-bg)}
.alt button.ratt{border-color:var(--green);background:var(--green-bg)}
.alt button:disabled{cursor:default}
/* delar i bilden */
#verk [data-del]{cursor:pointer;outline:none}
#verk [data-del]:hover,#verk [data-del]:focus-visible{filter:drop-shadow(0 0 5px #2563eb) drop-shadow(0 0 2px #2563eb)}
#verk .ledtrad{animation:blinkD .55s ease-in-out infinite alternate}
@keyframes blinkD{from{opacity:1;filter:drop-shadow(0 0 3px #f59e0b) drop-shadow(0 0 3px #f59e0b)}to{opacity:.35;filter:drop-shadow(0 0 14px #f59e0b) drop-shadow(0 0 6px #f59e0b)}}
.dold{display:none}
#verk .gronblink{animation:gronB .5s ease-in-out infinite alternate}
@keyframes gronB{from{filter:drop-shadow(0 0 2px #22c55e)}to{filter:drop-shadow(0 0 12px #22c55e) drop-shadow(0 0 5px #22c55e) brightness(1.15)}}
.steg .text.tidigare{color:var(--muted);font-size:.98rem}
/* rörelse */
.flode{fill:none;stroke-linecap:round;stroke-dasharray:4 22;animation:flyt 1.4s linear infinite}
.flode.lang{animation-duration:2.2s}
@keyframes flyt{to{stroke-dashoffset:-26}}
.rotor{animation:snurr .5s linear infinite}
@keyframes snurr{to{transform:translateY(-20px)}}
.bubbla{animation:stig 3s linear infinite;transform-box:fill-box}
@keyframes stig{0%{transform:translateY(0);opacity:0}10%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-320px);opacity:0}}
.glod{animation:glod 1.6s ease-in-out infinite alternate}
@keyframes glod{from{opacity:.35}to{opacity:.9}}
.blixt{animation:blixt .9s ease-in-out infinite alternate}
@keyframes blixt{from{opacity:.3}to{opacity:1}}
.genhjul{animation:hjul 1s linear infinite;transform-origin:130px 125px}
.genhjul2{animation:hjul .5s linear infinite}
.pumphjul{animation:hjul .6s linear infinite}
.pumphjul.sakta{animation-duration:2.4s}
@keyframes hjul{to{transform:rotate(360deg)}}
.puff{animation:puff 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(40px,170px) scale(2.8);opacity:0}}
#ventilAnga.ute .puff{animation-name:puffUt}
@keyframes puffUt{0%{transform:translate(0,0) scale(.5);opacity:.9}100%{transform:translate(50px,-50px) scale(2.4);opacity:0}}
.flamma{animation:flamma .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes flamma{to{transform:scaleY(1.35) scaleX(.85)}}
#explosion.visa{animation:boom 1.2s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes boom{0%{transform:scale(.1);opacity:1}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1.25);opacity:0}}
#tsunami.visa{animation:vag 2.4s ease-in forwards}
@keyframes vag{0%{transform:translate(-160px,60px)}60%{transform:translate(40px,0)}100%{transform:translate(180px,40px);opacity:0}}
#moln.drift #molnForm{animation:drift 6s ease-in-out forwards}
@keyframes drift{to{transform:translate(-560px,6px) scale(1.5)}}
.stopp,.stopp *{animation-play-state:paused!important}
.pausad *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.ritning:not(.spela) *{animation-play-state:paused!important}}
@media (max-width:640px){.steg .text{font-size:1rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Fysik · Kärnenergi · Kärnkraftverk</p>
    <h1>Olyckorna i kärnkraftverken</h1>
    <p>Tre kända olyckor – Harrisburg, Tjernobyl och Fukushima. Läs vad som hände och utsätt kärnkraftverket för samma sak, steg för steg. Gör du fel säger modellen ifrån.</p>
  </header>

  <section class="panel" aria-labelledby="h-val">
    <h2 id="h-val">Välj en olycka</h2>
    <div class="olyckor" id="olyckor"></div>
  </section>

  <section class="panel" aria-labelledby="h-verk">
    <h2 id="h-verk">Kärnkraftverket</h2>
    <div class="arbete">
    <div class="ritning" id="ritning"><svg id="verk" viewBox="-190 -24 1390 684" role="group" aria-labelledby="svgT" aria-describedby="svgD" font-family="Nunito,Arial,sans-serif">
<title id="svgT">Ett kärnkraftverk</title>
<desc id="svgD">Kärnbränslet i reaktorn värmer vattnet till ånga. Ångan snurrar turbinen som driver generatorn, och generatorn gör el som går ut på elnätet. I värmeväxlaren kyls ångan av kylvatten från havet och blir vatten igen. En pump pumpar tillbaka vattnet till reaktorn. Pumparna får el från elnätet eller från en reservgenerator. Runt reaktorn finns en tjock inneslutning, överst på reaktorn en säkerhetsventil och bredvid en nödkylning. I kontrollrummet finns mätare för effekt, temperatur och vattennivå och en lampa för ventilen.</desc>

 <linearGradient id="gVatten" x1="0" y1="0" x2="0" y2="1"><stop id="vTopp" offset="0" stop-color="#bfe3f7"/><stop id="vBotten" offset="1" stop-color="#6fb8e6"/></linearGradient>

};

/* ===================== Motor för stegen ===================== */
let kedjaKlar = [];
function ritaKedja(dold) {
  const el = $("kedjaLista"), ram = $("kedja"); if (!ram) return;
  if (!olycka || dold || !kedjaKlar.length) { ram.hidden = true; return; }
  ram.hidden = false;
  el.innerHTML = kedjaKlar.map((s, i) => `<li class="${i === kedjaKlar.length - 1 ? "ny" : ""}">${s.tid ? `<small>${s.tid}</small>` : ""}<span>${s.kedja}</span></li>`).join("");
}
let olycka = null, idx = 0, felAntal = 0, gjorda = new Set(), vantar = false, upptagen = false;
const klaraOlyckor = new Set();

function ritaVal() {
  $("olyckor").innerHTML = Object.entries(OLYCKOR).map(([id, o]) =>
    `<button type="button" class="olycka" data-olycka="${id}" aria-pressed="${olycka === id}"><b>${o.namn}</b><span>${o.ar}</span>${klaraOlyckor.has(id) ? '<span class="klar">✔ Klar</span>' : ""}</button>`).join("");
}
function startaOlycka(id) {
  olycka = id; S = bas(); OLYCKOR[id].setup(); idx = 0; kedjaKlar = []; ritaKedja(); gissar = false; gissResultat = null; gissStat = { ratt: 0, alla: 0 }; ritaVal(); visaSteg();
  document.querySelector("#h-verk").scrollIntoView({ behavior: "smooth", block: "start" });
}
function steg() { return olycka ? OLYCKOR[olycka].steg[idx] : null; }
function antalSteg() { return OLYCKOR[olycka].steg.length; }

function visaSteg() {
  rensaLedtrad(); felAntal = 0; gjorda = new Set(); vantar = false;
  const st = steg();
  if (!st) {
    stegEl.innerHTML = `<p class="nr">Välj en olycka</p><p class="text">Så här ser kärnkraftverket ut när allt fungerar. Välj en olycka ovanför bilden för att börja.</p>`;
    return;
  }
  let h = `<p class="nr">${OLYCKOR[olycka].namn} · ${idx === 0 ? "start" : `steg ${idx} av ${antalSteg() - 1}`}</p>`;
  if (st.text) h += `<p class="text">${st.text}</p>`;
  if (st.krav) h += `<p class="gor">${UTSATT}</p>`;
  if (st.fraga) h += `<p class="text"><b>${st.fraga.q}</b></p><div class="alt">${st.fraga.alt.map((a, i) => `<button type="button" data-alt="${i}">${a.t}</button>`).join("")}</div>`;
  h += `<div id="aterkoppling"></div>`;
  if (st.nasta) h += `<div class="knapprad"><button type="button" class="btn pri" id="nastaKnapp">${st.nasta} →</button></div>`;
  stegEl.innerHTML = h;
}
function aterkoppling(html, typ) { const a = $("aterkoppling"); if (a) a.innerHTML = html ? `<p class="svar ${typ}">${html}</p>` : ""; }

function stegKlart() {
  const st = steg(); rensaLedtrad(); vantar = true;
  let ms = 0;
  if (st.efter) ms = st.efter() || 0;
  upptagen = true;
  setTimeout(() => {
    upptagen = false;
    const sista = idx === antalSteg() - 1;
    const knapp = sista ? `<button type="button" class="btn pri" id="slutKnapp">Klar ✔</button>` : `<button type="button" class="btn pri" id="vidareKnapp">Nästa steg →</button>`;
    let sen = st.sen ? `<p class="svar ratt">✔ ${st.sen}</p>` : (st.fraga ? `<p class="svar ratt">✔ Rätt!</p>` : "");
    if (gissResultat) {
      sen = (gissResultat.ratt ? `<p class="svar ratt">🎯 Du gissade rätt!</p>` : `<p class="svar info">Du gissade: <i>${gissResultat.text}</i>. Så blev det inte – titta på bilden!</p>`) + sen;
      gissResultat = null;
    }
    stegEl.querySelectorAll(".gor, #nastaKnapp").forEach(x => x.remove());
    stegEl.querySelectorAll(".text").forEach(x => x.classList.add("tidigare"));
    const a = $("aterkoppling"); if (a) a.innerHTML = `<div class="knapprad">${knapp}</div>`;
    if (sen) stegEl.querySelector(".nr").insertAdjacentHTML("afterend", sen);
    blinka(st.blink);
    if (st.kedja) { kedjaKlar.push(st); ritaKedja(); }
    ($("vidareKnapp") || $("slutKnapp")).focus({ preventScroll: true });
  }, ms);
}

function blinka(lista) {
  (lista || []).forEach(n => {
    const el = $(n) || svg.querySelector(`[data-del="${n}"]`); if (!el) return;
    el.classList.remove("gronblink"); void el.getBoundingClientRect(); el.classList.add("gronblink");
  });
}
function fel(text) {
  felAntal++;
  aterkoppling(`Nej – det var inte det som hände. ${text}`, "fel");
  if (felAntal >= 2) visaLedtrad();
}
function visaLedtrad() {
  const st = steg(); if (!st || !st.krav) return;
  st.krav.forEach((k, i) => {
    if (gjorda.has(i)) return;
    if (k.del) { svg.querySelector(`[data-del="${k.del}"]`).classList.add("ledtrad"); const c = document.querySelector(`.delar [data-chip="${k.del}"]`); if (c) c.classList.add("ledtrad"); }
    if (k.stavar) { document.querySelector(".reglage").classList.add("ledtrad-reg"); svg.querySelector('[data-del="styrstavar"]').classList.add("ledtrad"); const c = document.querySelector('.delar [data-chip="styrstavar"]'); if (c) c.classList.add("ledtrad"); }
  });
}
function rensaLedtrad() {
  document.querySelectorAll(".gronblink").forEach(e => e.classList.remove("gronblink"));
  document.querySelectorAll(".ledtrad").forEach(e => e.classList.remove("ledtrad"));
  document.querySelector(".reglage").classList.remove("ledtrad-reg");
}

function uppfyll(i) {
  const st = steg(); gjorda.add(i);
  rensaLedtrad(); if (felAntal >= 2) visaLedtrad();
  if (st.gissa) {
    if (gjorda.size === st.krav.length) visaGissa(); else aterkoppling("Bra – en sak till.", "ratt");
    return;
  }
  const r = st.krav[i].gor() || 0;
  if (gjorda.size === st.krav.length) {
    if (st.klart) st.klart();
    if (r) { upptagen = true; setTimeout(() => { upptagen = false; stegKlart(); }, r); } else stegKlart();
  } else aterkoppling("Bra – en sak till.", "ratt");
}

let gissar = false, gissResultat = null, gissStat = { ratt: 0, alla: 0 };
function visaGissa() {
  const st = steg(); gissar = true; rensaLedtrad();
  const ordning = st.gissa.map((t, i) => i).sort(() => Math.random() - .5);
  aterkoppling("", "");
  $("aterkoppling").innerHTML = `<div class="svar info gissa"><b>🤔 Rätt! Gissa först: vad tror du händer nu?</b>
    <div class="alt">${ordning.map(i => `<button type="button" data-gissa="${i}">${st.gissa[i]}</button>`).join("")}</div>
    <small id="gissNot"></small></div>`;
}
function gissa(i) {
  const st = steg(); gissar = false;
  gissResultat = { ratt: i === 0, text: st.gissa[i] };
  gissStat.alla++; if (i === 0) gissStat.ratt++;
  let r = 0; st.krav.forEach(k => { r = Math.max(r, k.gor() || 0); });
  if (st.klart) st.klart();
  $("aterkoppling").innerHTML = `<p class="svar info">Titta på bilden …</p>`;
  upptagen = true; setTimeout(() => { upptagen = false; stegKlart(); }, Math.max(r, 1200));
}
function klickDel(del) {
  const st = steg();
  if (!st) { infoUtanOlycka(); return; }
  if (upptagen) return;
  if (gissar) { $("gissNot").textContent = "Välj först vad du tror händer!"; return; }
  if (vantar) { aterkoppling2("Klicka på <b>Nästa steg</b> för att gå vidare."); return; }
  if (st.fraga) { aterkoppling("Svara på frågan först.", "info"); return; }
  if (st.nasta) { aterkoppling(`Läs texten och klicka på <b>${st.nasta}</b>.`, "info"); return; }
  if (del === "styrstavar") {
    if (st.krav.some((k, j) => k.stavar && !gjorda.has(j))) {
      aterkoppling(`Vad gör du med styrstavarna?<span class="stavval"><button type="button" class="btn" data-stav="1">▲ Skjut in helt</button><button type="button" class="btn" data-stav="bit">▲ Skjut in en bit</button><button type="button" class="btn" data-stav=".1">▼ Dra ut nästan helt</button></span>`, "info");
    } else fel(st.fel);
    return;
  }
  const i = st.krav.findIndex((k, j) => k.del === del && !gjorda.has(j));
  if (i >= 0) uppfyll(i);
  else if (st.krav.some((k, j) => k.del === del && gjorda.has(j))) aterkoppling("Det har du redan gjort.", "info");
  else fel(st.fel);
}
function aterkoppling2(html) {
  const a = $("aterkoppling"); if (!a) return;
  let p = a.querySelector(".svar.info"); if (!p) { p = document.createElement("p"); p.className = "svar info"; a.prepend(p); }
  p.innerHTML = html;
}
function infoUtanOlycka() {
  stegEl.innerHTML = `<p class="nr">Välj en olycka</p><p class="text">Välj först en olycka ovanför bilden – sedan får du utsätta kärnkraftverket för det som hände.</p>`;
}

/* styrstavar */
function stavarAndrade(nytt) {
  const forra = S.stavarMal, st = steg();
  const aterstall = () => { reg.value = Math.round(forra * 100); visaReg(); };
  if (!st) { aterstall(); infoUtanOlycka(); return; }
  if (upptagen || gissar || vantar || st.fraga || st.nasta) { aterstall(); klickDel("__ingen"); return; }
  const i = st.krav.findIndex((k, j) => k.stavar && !gjorda.has(j));
  if (i < 0) { aterstall(); fel(st.fel); return; }
  const typ = st.krav[i].stavar;
  if (typ === "in-helt") {
    if (nytt === 1) { S.stavarMal = 1; uppfyll(i); }
    else if (nytt > forra) { S.stavarMal = nytt; aterkoppling("Rätt håll – men skjut in dem hela vägen.", "info"); }
    else { aterstall(); fel(st.fel); }
  } else if (typ === "in-bit") {
    if (nytt > forra && nytt < 1) { S.stavarMal = nytt; uppfyll(i); }
    else if (nytt === 1) { aterstall(); aterkoppling("Bara en bit – personalen ville sänka effekten, inte stoppa reaktorn.", "info"); }
    else { aterstall(); fel(st.fel); }
  } else if (typ === "ut") {
    if (nytt <= .2 && nytt < forra) { S.stavarMal = nytt; uppfyll(i); }
    else if (nytt < forra) { S.stavarMal = nytt; aterkoppling("Rätt håll – men personalen drog ut <b>nästan alla</b>.", "info"); }
    else { aterstall(); fel(st.fel); }
  } else if (typ === "in") {
    if (nytt > forra) { uppfyll(i); }
    else { aterstall(); fel(st.fel); }
  }
}
let drar = false;
function visaReg() { regUt.textContent = `${reg.value} % inne`; }
reg.addEventListener("input", () => { drar = true; visaReg(); });
reg.addEventListener("change", () => { drar = false; stavarAndrade(Number(reg.value) / 100); });

/* ===================== Klick ===================== */
svg.addEventListener("click", e => { const g = e.target.closest("[data-del]"); if (g) klickDel(g.dataset.del); });
svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.del) { e.preventDefault(); klickDel(e.target.dataset.del); } });
const CHIPNAMN = { styrstavar: "styrstavar", generator: "generator", turbin: "turbin", varmevaxlare: "värmeväxlare", pump: "pump", reaktor: "kärnreaktor", ventil: "säkerhetsventil", nodkylning: "nödkylning", elnat: "elnät", reserv: "reservgenerator", hav: "havet" };
$("delar").insertAdjacentHTML("beforeend", CHIPS.map(d => `<button type="button" data-chip="${d}">${CHIPNAMN[d]}</button>`).join(""));
$("delar").addEventListener("click", e => { const b = e.target.closest("[data-chip]"); if (b) klickDel(b.dataset.chip); });
$("olyckor").addEventListener("click", e => { const b = e.target.closest("[data-olycka]"); if (b) startaOlycka(b.dataset.olycka); });
stegEl.addEventListener("click", e => {
  const st = steg(); if (!st) return;
  const sv = e.target.closest("[data-stav]");
  if (sv) { const v = sv.dataset.stav === "bit" ? Math.min(1, Math.round((S.stavarMal + .2) * 10) / 10) : Number(sv.dataset.stav); reg.value = Math.round(v * 100); visaReg(); stavarAndrade(v); return; }
  if (e.target.id === "nastaKnapp") { e.target.disabled = true; if (!st.sen && !st.efter) { idx++; visaSteg(); } else stegKlart(); }
  else if (e.target.id === "vidareKnapp") { idx++; visaSteg(); }
  else if (e.target.id === "slutKnapp") {
    klaraOlyckor.add(olycka); ritaVal(); ritaKedja(true);
    stegEl.innerHTML = `<p class="nr">${OLYCKOR[olycka].namn} · klar</p><p class="text">Bra jobbat! Du har gått igenom olyckan i ${OLYCKOR[olycka].namn}.</p><p class="svar ratt">🎯 Du gissade rätt på <b>${gissStat.ratt} av ${gissStat.alla}</b> steg.</p><p class="text">Välj en annan olycka ovanför bilden.</p>`;
  } else if (e.target.dataset.gissa !== undefined && gissar) { gissa(Number(e.target.dataset.gissa));
  } else if (e.target.dataset.alt !== undefined && st.fraga && !vantar) {
    const a = st.fraga.alt[Number(e.target.dataset.alt)];
    if (a.ok) { e.target.classList.add("ratt"); stegEl.querySelectorAll("[data-alt]").forEach(b => b.disabled = true); stegKlart(); }
    else { e.target.classList.add("fel"); e.target.disabled = true; aterkoppling(a.f, "fel"); }
  }
});
$("omstart").addEventListener("click", () => { if (olycka) startaOlycka(olycka); else { S = bas(); visaSteg(); } });
const paus = $("paus");
let pausad = false;
if (matchMedia("(prefers-reduced-motion: reduce)").matches) { pausad = true; ritning.classList.add("pausad"); paus.textContent = "▶ Spela rörelsen"; paus.setAttribute("aria-pressed", "true"); }
paus.addEventListener("click", () => { pausad = ritning.classList.toggle("pausad"); ritning.classList.add("spela"); paus.textContent = pausad ? "▶ Spela rörelsen" : "⏸ Pausa rörelsen"; paus.setAttribute("aria-pressed", String(pausad)); });

/* ===================== Rita ===================== */
const kl = (id, c, on) => $(id).classList.toggle(c, !!on);
const narma = (a, b, f) => Math.abs(b - a) <= f ? b : a + Math.sign(b - a) * f;
let t0 = performance.now();
function rita(t) {
  const dt = Math.min(.1, (t - t0) / 1000); t0 = t;
  if (!pausad) {
    for (const k of ["effekt", "temp", "niva"]) S.cur[k] = narma(S.cur[k], S.mal[k], S.fart[k] * dt);
    S.stavar = narma(S.stavar, S.stavarMal, S.stavarFart * dt);
  }
  const c = S.cur, el = S.elnat || S.reserv === "pa";
  const pumpGar = S.pump && el, nodGar = S.nod === "pa" && el, turbGar = S.turbin && c.effekt > .15;
  document.querySelectorAll("#verk .snurr").forEach(e => e.classList.toggle("stopp", !turbGar));
  ["angaTurbin", "angaRor", "angaNer"].forEach(id => kl(id, "dold", !turbGar));
  kl("elUt", "dold", !(turbGar && S.elnat));
  kl("elPump", "dold", !S.elnat); kl("elReserv", "dold", S.elnat || S.reserv !== "pa");
  kl("pumpHjul", "stopp", !pumpGar); kl("pumpHjul", "sakta", S.pumpSakta);
  kl("returFlode", "dold", !pumpGar); $("returFlode").style.animationDuration = S.pumpSakta ? "4s" : "";
  kl("kylFlode", "dold", !el);
  kl("nodHjul", "stopp", !nodGar); kl("nodFlode", "dold", !nodGar); kl("nodAv", "dold", S.nod !== "avstangd");
  kl("reservHjul", "stopp", S.reserv !== "pa"); kl("reservTrasig", "dold", S.reserv !== "trasig");
  $("reservLada").setAttribute("fill", S.reserv === "trasig" ? "#55634a" : "#7c9a5a");
  kl("elnatBrott", "dold", S.elnat); kl("turbinAv", "dold", S.turbin);
  $("ventilSymbol").setAttribute("fill", S.ventil === "oppen" ? "#d63c45" : "#2f9e57");
  const angaUt = S.ventil === "oppen" && c.temp > .3;
  kl("ventilAnga", "dold", !angaUt); kl("ventilAnga", "ute", S.inn === "saknas");
  $("ventilAngaPuffar").setAttribute("clip-path", S.inn === "saknas" ? "" : "url(#cInne)");
  if (angaUt && S.inn !== "saknas") S.innAnga = Math.min(.55, (S.innAnga || 0) + dt * .05);
  $("innAnga").setAttribute("opacity", (S.innAnga || 0).toFixed(3));
  const oppen = S.lampa === "oppen";
  $("ventilLampa").setAttribute("fill", oppen ? "#ef4444" : "#22c55e");
  $("ventilText").textContent = oppen ? "ÖPPEN" : "STÄNGD"; $("ventilText").setAttribute("fill", oppen ? "#fca5a5" : "#86efac");
  kl("varning", "dold", !S.varning);
  $("glodGrupp").style.opacity = Math.max(0, Math.min(1, c.effekt));
  $("bubblor").style.opacity = Math.max(0, Math.min(1, (c.temp - .25) * 2.2));
  const v = Math.max(0, Math.min(1, (c.temp - .5) / .45));
  const blanda = (a, b) => "#" + [0, 2, 4].map(i => Math.round(parseInt(a.substr(i, 2), 16) * (1 - v) + parseInt(b.substr(i, 2), 16) * v).toString(16).padStart(2, "0")).join("");
  $("vTopp").setAttribute("stop-color", blanda("bfe3f7", "fed7aa")); $("vBotten").setAttribute("stop-color", blanda("6fb8e6", "ef4444"));
  const y = 150 + (1 - c.niva) * 330;
  $("vatten").setAttribute("y", y); $("vatten").setAttribute("height", Math.max(0, 552 - y)); $("vattenClip").setAttribute("y", y);
  const ut = Math.max(0, Math.min(230, y - 250));
  document.querySelectorAll("#hettGrupp .hett").forEach(r => { r.setAttribute("height", ut); r.style.opacity = ut ? .85 : 0; });
  $("stavar").setAttribute("transform", `translate(0 ${((1 - S.stavar) * 230).toFixed(1)})`);
  if (!drar && S.stavarFart < 1) { reg.value = Math.round(S.stavar * 10) * 10; visaReg(); }
  kl("smalt", "dold", !S.smalt);
  const eh = Math.min(160, c.effekt / 1.5 * 160);
  $("effektStapel").setAttribute("y", 244 - eh); $("effektStapel").setAttribute("height", eh); $("effektStapel").setAttribute("fill", c.effekt > 1.4 ? "#ef4444" : "#a78bfa");
  const th = c.temp * 160; $("tempStapel").setAttribute("y", 244 - th); $("tempStapel").setAttribute("height", th); $("tempStapel").setAttribute("fill", c.temp > .85 ? "#ef4444" : "#f59e0b");
  const nh = S.nivaFel ? 160 : c.niva * 160; $("nivaStapel").setAttribute("y", 244 - nh); $("nivaStapel").setAttribute("height", nh);
  $("nivaStapel").setAttribute("fill", S.nivaFel ? "#ef4444" : "#60a5fa"); kl("nivaFel", "dold", !S.nivaFel);
  kl("inneslutning", "dold", S.inn === "saknas"); kl("innEtikett", "dold", S.inn === "saknas"); kl("innSaknas", "dold", S.inn !== "saknas");
  kl("innSkadad", "dold", S.inn !== "skadad"); kl("innHoll", "dold", S.inn !== "holl");
  $("innRam").setAttribute("stroke", S.inn === "holl" ? "#2f9e57" : "#9aa1ab");
  kl("brand", "dold", !S.brand); kl("moln", "dold", !S.moln); kl("moln", "drift", S.drift);
  $("molnForm").setAttribute("transform", S.moln === "litet" ? "translate(477 4) scale(.7)" : "");
  $("molnText").textContent = S.molnText;
  kl("havsvatten", "dold", !S.havsvatten); kl("oversvamning", "dold", !S.flood);
  requestAnimationFrame(rita);
}
ritaVal(); visaSteg(); visaReg(); requestAnimationFrame(rita);

</script>
