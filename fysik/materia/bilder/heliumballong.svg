<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" font-family="Arial, sans-serif" role="img" aria-label="En heliumballong stiger i luften och en ballong med vanlig luft sjunker."><rect x="160" y="30" width="420" height="300" fill="#f1f5f9"/><path d="M275,170 q-8,22 4,40 q9,16 -3,34" fill="none" stroke="#1f2937" stroke-width="1.5"/><ellipse cx="275" cy="112" rx="46" ry="56" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/><polygon points="270,167 280,167 275,174" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="275" y="119" text-anchor="middle" font-size="18" font-weight="bold" fill="#db2777">He</text><g stroke="#16a34a" stroke-width="3" stroke-linecap="round" fill="none"><path d="M340,140 L340,80"/><path d="M331,91 L340,78 L349,91"/></g><ellipse cx="480" cy="282" rx="38" ry="44" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><polygon points="475,325 485,325 480,330" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><line x1="229" y1="112" x2="168" y2="106" stroke="#1f2937" stroke-width="1"/><text x="10" y="92" font-size="17" font-weight="bold" fill="#db2777">heliumballong</text><text x="10" y="112" font-size="14" fill="#1f2937">helium: 0,00018 g/cm³</text><text x="10" y="130" font-size="14" font-weight="bold" fill="#16a34a">stiger</text><text x="430" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#475569">luft</text><text x="430" y="150" text-anchor="middle" font-size="14" fill="#1f2937">0,0012 g/cm³</text><line x1="518" y1="282" x2="600" y2="250" stroke="#1f2937" stroke-width="1"/><text x="600" y="210" font-size="17" font-weight="bold" fill="#1f2937">ballong med</text><text x="600" y="230" font-size="17" font-weight="bold" fill="#1f2937">vanlig luft</text><text x="604" y="268" font-size="14" font-weight="bold" fill="#dc2626">sjunker</text></svg>