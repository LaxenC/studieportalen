<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" font-family="Arial, sans-serif" role="img" aria-label="Ett akvarium med vatten. En isbit flyter med det mesta under ytan och en järnspik ligger på botten.">
  <rect x="112" y="70" width="376" height="228" fill="#bfdbfe" opacity=".75"/>
  <line x1="112" y1="70" x2="488" y2="70" stroke="#2563eb" stroke-width="2"/>
  <path d="M110,30 L110,300 L490,300 L490,30" fill="none" stroke="#1f2937" stroke-width="4"/>
  <!-- isbit: 90 % under ytan -->
  <rect x="190" y="61" width="80" height="90" rx="6" fill="#f0f9ff" stroke="#60a5fa" stroke-width="2.5" opacity=".95"/>
  <line x1="120" y1="70" x2="480" y2="70" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- spik -->
  <g transform="translate(330 280) rotate(-8)">
    <rect x="0" y="-5" width="100" height="10" fill="#6b7280" stroke="#374151"/>
    <rect x="-6" y="-11" width="8" height="22" rx="2" fill="#4b5563"/>
    <polygon points="100,-5 118,0 100,5" fill="#6b7280" stroke="#374151"/>
  </g>
  <!-- etiketter -->
  <line x1="190" y1="100" x2="60" y2="100" stroke="#1f2937" stroke-width="1"/>
  <text x="10" y="96" font-size="15" font-weight="bold" fill="#2563eb">is</text>
  <text x="10" y="114" font-size="13" fill="#1f2937">0,9 g/cm³</text>
  <text x="10" y="130" font-size="13" font-weight="bold" fill="#16a34a">flyter</text>
  <line x1="450" y1="276" x2="510" y2="230" stroke="#1f2937" stroke-width="1"/>
  <text x="500" y="196" font-size="15" font-weight="bold" fill="#374151">järnspik</text>
  <text x="500" y="214" font-size="13" fill="#1f2937">7,9 g/cm³</text>
  <text x="515" y="232" font-size="13" font-weight="bold" fill="#dc2626">sjunker</text>
  <text x="380" y="140" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">vatten</text>
  <text x="380" y="158" font-size="13" fill="#1f2937" text-anchor="middle">1,0 g/cm³</text>
  <text x="300" y="322" font-size="13" fill="#4b5563" text-anchor="middle">Lägre densitet än vattnet → flyter. Högre densitet än vattnet → sjunker.</text>
</svg>
