<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" font-family="Arial, sans-serif" role="img" aria-label="En stor träbit och en liten järnbit väger lika mycket, 100 g. I vatten flyter träbiten och järnbiten sjunker.">
  <!-- Vänster: våg i balans -->
  <text x="150" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Väger lika mycket</text>
  <polygon points="150,215 132,250 168,250" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
  <line x1="20" y1="205" x2="280" y2="205" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="205" r="6" fill="#1f2937"/>
  <rect x="22" y="105" width="96" height="97" fill="#d9a066" stroke="#1f2937" stroke-width="2"/>
  <text x="70" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">trä</text>
  <text x="70" y="170" text-anchor="middle" font-size="13" fill="#1f2937">100 g</text>
  <rect x="215" y="174" width="30" height="28" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
  <text x="230" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">järn</text>
  <text x="230" y="230" text-anchor="middle" font-size="13" fill="#1f2937">100 g</text>
  <text x="150" y="280" text-anchor="middle" font-size="13" fill="#4b5563">Samma massa – men träbiten</text>
  <text x="150" y="297" text-anchor="middle" font-size="13" fill="#4b5563">har mycket större volym</text>
  <!-- Pil -->
  <polygon points="300,160 330,160 330,150 350,168 330,186 330,176 300,176" fill="#93c5fd"/>
  <!-- Höger: akvarium -->
  <text x="505" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">I vatten</text>
  <rect x="377" y="90" width="256" height="188" fill="#bfdbfe" opacity=".75"/>
  <line x1="377" y1="90" x2="633" y2="90" stroke="#2563eb" stroke-width="2"/>
  <path d="M375,50 L375,280 L635,280 L635,50" fill="none" stroke="#1f2937" stroke-width="4"/>
  <rect x="400" y="52" width="95" height="97" fill="#d9a066" stroke="#1f2937" stroke-width="2" opacity=".95"/>
  <line x1="377" y1="90" x2="633" y2="90" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="447" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">flyter</text>
  <rect x="570" y="248" width="30" height="28" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
  <text x="585" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">sjunker</text>
  <text x="505" y="300" text-anchor="middle" font-size="13" fill="#4b5563">trä: 0,6 g/cm³ · vatten: 1,0 g/cm³ · järn: 7,9 g/cm³</text>
</svg>
