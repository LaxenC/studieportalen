<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" font-family="Arial, sans-serif" role="img" aria-label="En vattenmolekyl, H2O: en syreatom i mitten med två väteatomer.">
  <defs>
    <radialGradient id="o" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
    <radialGradient id="h" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d1d5db"/></radialGradient>
  </defs>
  <circle cx="120" cy="140" r="30" fill="url(#h)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="260" cy="140" r="30" fill="url(#h)" stroke="#1f2937" stroke-width="2"/>
  <circle cx="190" cy="95" r="48" fill="url(#o)" stroke="#1f2937" stroke-width="2"/>
  <text x="190" y="104" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff">O</text>
  <text x="112" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">H</text>
  <text x="268" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">H</text>
  <text x="190" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">H₂O – en vattenmolekyl</text>
  <text x="190" y="205" text-anchor="middle" font-size="14" fill="#1f2937"><tspan font-weight="bold" fill="#c2410c">1 syreatom (O)</tspan> + <tspan font-weight="bold" fill="#4b5563">2 väteatomer (H)</tspan></text>
</svg>
