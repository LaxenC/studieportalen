<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Inter,Arial,sans-serif" text-anchor="middle">
<rect width="680" height="300" fill="#fff"/>
<!-- Bakterie -->
<text x="200" y="34" font-size="18" font-weight="800" fill="#1d2a3a">Bakterie</text>
<rect x="40" y="80" width="320" height="130" rx="65" fill="#fbe0de" stroke="#c4524b" stroke-width="6"/>
<path d="M110 150 C125 112 160 190 190 150 S240 108 262 148 S300 192 292 138 S236 118 222 160 S150 182 140 128" fill="none" stroke="#6b2a26" stroke-width="3.5" stroke-linecap="round"/>
<line x1="200" y1="234" x2="190" y2="152" stroke="#4a5568" stroke-width="2"/><circle cx="190" cy="152" r="4" fill="#4a5568"/>
<text x="200" y="256" font-size="17" font-weight="800" fill="#1d2a3a">arvsmassa (DNA)</text>
<text x="200" y="278" font-size="15" fill="#4a5568">ligger fritt i cellen</text>
<line x1="360" y1="62" x2="336" y2="92" stroke="#4a5568" stroke-width="2"/><circle cx="336" cy="92" r="4" fill="#4a5568"/>
<text x="378" y="58" font-size="16" font-weight="800" fill="#1d2a3a">en cell</text>
<!-- Jämförelse -->
<line x1="440" y1="50" x2="440" y2="270" stroke="#d6dbe3" stroke-width="2" stroke-dasharray="6 6"/>
<text x="565" y="34" font-size="15" font-weight="800" fill="#4a5568">Jämför: cell med cellkärna</text>
<ellipse cx="565" cy="145" rx="95" ry="70" fill="#ece4fb" stroke="#7b5cc4" stroke-width="5"/>
<circle cx="565" cy="145" r="32" fill="#d6c8f3" stroke="#5f40a8" stroke-width="3"/>
<path d="M545 145 c6 -12 12 10 20 0 s12 -10 20 2" fill="none" stroke="#3d2378" stroke-width="3" stroke-linecap="round"/>
<line x1="565" y1="234" x2="565" y2="177" stroke="#4a5568" stroke-width="2"/><circle cx="565" cy="177" r="4" fill="#4a5568"/>
<text x="565" y="256" font-size="17" font-weight="800" fill="#1d2a3a">cellkärna</text>
<text x="565" y="278" font-size="15" fill="#4a5568">arvsmassan ligger i kärnan</text>
</svg>
