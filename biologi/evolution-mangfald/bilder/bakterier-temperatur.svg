<text x="166" y="331.5" font-size="16" font-weight="800" fill="#1d2a3a">Under +8 °C – till exempel i kylskåpet</text>
<text x="166" y="353.5" font-size="15" fill="#1d2a3a">Bakterierna växer långsammare.</text>
<rect x="509" y="331.5" width="22" height="12" rx="6" fill="#c9ecc9" stroke="#2e8b3e" stroke-width="2"/><circle cx="520" cy="337.5" r="2.4" fill="#2e8b3e"/>
