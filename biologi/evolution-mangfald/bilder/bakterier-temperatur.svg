<text x="166" y="405.5" font-size="16" font-weight="800" fill="#1d2a3a">−18 °C – till exempel i frysen</text>
<text x="166" y="427.5" font-size="15" fill="#1d2a3a">Bakterierna förökar sig inte, men de flesta dör inte.</text>
<text x="166" y="448.5" font-size="15" fill="#1d2a3a">De kan börja växa igen när maten tinas.</text>
