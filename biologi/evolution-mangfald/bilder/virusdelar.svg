<text x="425" text-anchor="start" y="222" font-size="15" fill="#4a5568">receptet för nya virus</text>
<text x="340" y="302" font-size="15" font-weight="700" fill="#4a5568">Ingen cell, inga fabriker – viruset måste använda en värdcells fabriker.</text>
