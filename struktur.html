<style>
.st-trad,.st-trad ul{list-style:none;margin:0;padding-left:0}
.st-trad ul{padding-left:22px;border-left:2px solid var(--line);margin:4px 0 4px 6px}
.st-trad li{padding:3px 0}
.st-amne{margin-top:10px}
.st-omr>a b{font-size:1.1rem}
.st-kap>a{font-weight:900}
.st-dim{color:var(--muted);font-size:.88rem}
.st-ak{font-size:.8rem;font-weight:800;background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd);border-radius:999px;padding:0 8px}
.st-niv{font-size:.78rem;font-weight:800;background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:0 6px;margin-left:3px;font-variant-numeric:tabular-nums}
.st-niv.tom{background:var(--bg);color:var(--muted)}
.st-ok{color:var(--green);font-weight:900}
.st-nej{color:var(--proton);font-weight:900}
.st-dold{opacity:.55}
#varn ul{margin:6px 0 0;padding-left:1.2em;display:grid;gap:4px}
#varn h2{font-size:1.15rem}
#varn a{color:var(--ink)}
@media print{.topp,.gr-filter,#akval{display:none}body{background:#fff}.panel{padding:0}}
</style>
</head>
<body>
<main class="wrap">
  <header class="ovhead"><div><p class="eyebrow">För läraren</p><h1>Portalens struktur</h1>

    <span class="gr-filter" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="ghostbtn" onclick="print()">Skriv ut</button><a class="ghostbtn" href="granska.html">Granska uppgifter</a><a class="ghostbtn" href="./">Till portalen</a></span></header>
  <div class="akval stor" id="akval" role="radiogroup" aria-label="Visa för årskurs"></div>
  <section class="panel" id="varn"><p class="laddar">Laddar …</p></section>
  <section class="panel" id="trad"></section>
</main>
